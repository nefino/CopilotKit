[tool.poetry]
name = "copilotkit"
version = "0.1.65"
description = "CopilotKit python SDK"
authors = ["Markus Ecker <markus.ecker@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://copilotkit.ai"
repository = "https://github.com/CopilotKit/CopilotKit/tree/main/sdk-python"
keywords = ["copilot", "copilotkit", "langgraph", "langchain", "ai", "langsmith", "langserve"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
langgraph = {version = ">=0.3.25,<1.1.0"}
langchain = {version = ">=0.3.0"}
crewai = { version = "0.118.0", optional = true }
ag-ui-langgraph = {git = "https://github.com/nefino/ag-ui.git", rev = "2445ecd36aa835e158c86dd64f16aba0fa541e23", subdirectory = "typescript-sdk/integrations/langgraph/python", extras = ["fastapi"]}
fastapi = ">=0.115.0,<0.117.0"
partialjson = "^0.0.8"
toml = "^0.10.2"

[tool.poetry.extras]
crewai = ["crewai"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
